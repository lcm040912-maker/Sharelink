# Sha<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share Link</title>
<style>
body{font-family:sans-serif;background:#f0f2f5;margin:0}
.header{background:#5b6f9e;color:white;padding:15px;font-size:22px;font-weight:bold}
.box{margin:15px;background:white;padding:15px;border-radius:8px}
textarea{width:100%;height:200px;padding:10px;font-size:16px}
button{width:100%;padding:12px;background:#5b6f9e;color:white;border:none;border-radius:6px;font-size:16px;margin-top:10px}
</style>
</head>
<body>
<div class="header">FNOTE.ME Clone</div>
<div class="box">
<textarea id="c" placeholder="Dan link vuot vao day..."></textarea>
<button onclick="go()">Tao Link</button>
<a id="l" style="display:block;margin-top:15px;word-break:break-all"></a>
<div id="v" style="margin-top:15px;white-space:pre-wrap"></div>
</div>
<script>
function go(){
let t=document.getElementById('c').value;
if(!t)return alert('Chua dan gi!');
let e=btoa(unescape(encodeURIComponent(t)));
let u=location.origin+location.pathname+'#'+e;
document.getElementById('l').innerHTML='Link cua ban:<br>'+u;
document.getElementById('l').href=u;
}
window.onload=function(){
if(location.hash){
try{
let d=decodeURIComponent(escape(atob(location.hash.slice(1))));
document.getElementById('v').innerHTML='<b>Noi dung:</b><br><div style=background:#eee;padding:10px;border-radius:6px>'+d.replace(/\n/g,'<br>')+'</div>';
}catch(e){}
}
}
</script>
</body>
</html>
